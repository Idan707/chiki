name: Bug report
description: Report a reproducible problem with Chiki
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Never include secrets, child data, transcripts, or recordings.
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: This report does not contain sensitive data and is not a security vulnerability.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Firmware
        - Worker
        - Agent configuration
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Include board revision and sanitized logs when relevant.
    validations:
      required: true
