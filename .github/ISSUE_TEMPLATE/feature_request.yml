name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem first. For child-facing changes, include safety and privacy effects.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Safety, privacy, and hardware tradeoffs
      description: What new data, cloud behavior, or device behavior would this introduce?
    validations:
      required: true
